# SonarQube Cloud analysis scope.
#
# Read by the Automatic Analysis that runs on every push and pull request. Without it the scan
# measures files nobody can act on, and the report's numbers describe the wrong thing.
#
# The exclusions below are not size trimming for its own sake — each one is a file whose issues
# would be unactionable:
#
#   pnpm-lock.yaml     8660 lines, and 96% of all YAML in the repository. It is generated by the
#                      package manager and edited by nobody. It was also the bulk of the 8253 lines
#                      the failing analysis reported (yaml=6898).
#   registry/r/**      98 files emitted by `pnpm registry:build` from src/. The source is analysed;
#                      analysing the artifact as well double-counts every finding.
#   dist/, build/      Build output. Same argument, and neither is committed.
#   *.test.*, *.stories.*
#                      Test and story files. They are exercised by the suite, and Sonar's
#                      maintainability rules for production code make poor sense on a fixture.
#
# What remains is the ~16k lines under src/ that people actually write.

sonar.projectKey=usetheodev_usetheo-ui
sonar.organization=usetheodev

sonar.sources=src,scripts
sonar.exclusions=**/pnpm-lock.yaml,registry/r/**,dist/**,build/**,node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,**/__snapshots__/**

# Tests are declared rather than merely excluded, so Sonar attributes them as tests instead of
# treating their absence as missing coverage on files it cannot see.
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8
