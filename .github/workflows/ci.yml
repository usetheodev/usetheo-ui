name: CI

# Until this file existed, nothing in this repository checked a pull request beyond the secret
# scan: no lint, no types, no tests, no build. A PR could turn every suite red and still show
# green checks, because there was nothing to be red. The gates ran only on the author's machine,
# which is the one place they are guaranteed to have been skipped at least once.
#
# The steps below are the same ones `pnpm` exposes locally, in the same order, so a green run here
# means exactly what a clean local run means — no CI-only variant to keep in sync.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - workspace

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict, which reads the
  # same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  verify:
    name: Verify (lint · types · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would let any later step, or
          # any tool reading the config, act as this repository.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          # The cache key must change when the package manager does. setup-node keys the pnpm
          # store on the lockfile alone, so a pnpm major bump leaves the key identical and the job
          # restores a store the new pnpm reads as inconsistent. package.json carries
          # `packageManager`, so including it ties the cache to the pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each gate is its own step so a red run names what broke in the job list, instead of
      # requiring someone to open the log to find out which of five commands failed.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The registry is what the shadcn copy-paste path serves. An artifact that drifts from
      # `src/` is a broken install for anyone using that path, and it drifts silently — the
      # package build succeeds either way.
      - name: Registry is current
        run: |
          pnpm registry:build
          git diff --exit-code registry/ || {
            echo "::error::registry/ is stale against src/. Run 'pnpm registry:build' and commit the result."
            exit 1
          }

      - name: Registry is valid
        run: pnpm registry:validate
