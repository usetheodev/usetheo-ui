name: Deploy Registry to GitHub Pages

# Publish registry/r/*.json to GitHub Pages so the shadcn copy-paste path
# (`npx shadcn@latest add <url>/r/<name>.json`) resolves. Functional URL is
# https://usetheodev.github.io/usetheo-ui/r/<name>.json — this is also what
# @theokit/ui's registry cross-references via registryDependencies.

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm registry:build

      - name: Validate registry
        run: pnpm registry:validate

      - name: Prepare site directory
        run: |
          mkdir -p _site/r
          cp -r registry/r/* _site/r/
          cp registry/index.json _site/index.json
          # Landing page so /index.html doesn't 404.
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>@usetheo/ui — registry</title>
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px auto; max-width: 720px; padding: 0 20px; color: #111; }
              code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
              a { color: #7c3aed; }
            </style>
          </head>
          <body>
            <h1>@usetheo/ui — registry</h1>
            <p>shadcn-compatible component registry for <a href="https://github.com/usetheodev/usetheo-ui">@usetheo/ui</a> (the generic + cloud-ops layer that <a href="https://www.npmjs.com/package/@theokit/ui">@theokit/ui</a> builds on).</p>
            <p>Install any component:</p>
            <pre><code>npx shadcn@latest add https://usetheodev.github.io/usetheo-ui/r/button.json</code></pre>
            <p>See the <a href="index.json">catalog index</a> for all items.</p>
            <hr />
            <p>npm: <a href="https://www.npmjs.com/package/@usetheo/ui"><code>pnpm add @usetheo/ui</code></a></p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-registry
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
